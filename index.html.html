<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理奇物档案馆</title>
    <style>
        :root {
            --blue: #4A90D9;
            --blue-dark: #357ABD;
            --blue-light: #eaf3fb;
            --bg: #f3f7fb;
            --white: #ffffff;
            --text: #2c3e50;
            --text-light: #5f6d7a;
            --green: #27ae60;
            --green-bg: #eafaf1;
            --red: #e74c3c;
            --red-bg: #fdedec;
            --gold: #f0a500;
            --gold-bg: #fffdf5;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
            --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.05);
            --radius: 18px;
            --radius-sm: 12px;
            --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(165deg, #e7f0f9 0%, #f3f7fb 30%, #eef3f8 60%, #e3ecf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        body::before {
            content: '';
            position: fixed;
            top: -160px;
            right: -100px;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(74, 144, 217, 0.07) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -130px;
            left: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(74, 144, 217, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(20px, 4vw, 30px);
            position: relative;
            z-index: 1;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            transition: all var(--transition);
        }

        /* ========== 页面切换 ========== */
        .page {
            display: none;
            flex-direction: column;
            flex: 1;
            animation: fadeIn 0.38s ease-out;
        }
        .page.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes popIn {
            0% {
                transform: scale(0.25);
                opacity: 0;
            }
            55% {
                transform: scale(1.08);
            }
            75% {
                transform: scale(0.94);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.07);
            }
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.5);
            }
        }
        @keyframes cardReveal {
            0% {
                transform: rotateY(90deg) scale(0.5);
                opacity: 0;
            }
            55% {
                transform: rotateY(-10deg) scale(1.04);
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
        }

        /* ========== 首页 ========== */
        .home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            gap: 16px;
            padding: 6px 0;
        }
        .home-icon {
            font-size: clamp(50px, 9vw, 66px);
            animation: popIn 0.7s ease-out;
            filter: drop-shadow(0 5px 10px rgba(74, 144, 217, 0.22));
        }
        .home-title {
            font-size: clamp(1.4rem, 2.8vw, 1.8rem);
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.4px;
            line-height: 1.3;
        }
        .home-title span {
            color: var(--blue);
        }
        .home-desc {
            font-size: clamp(0.9rem, 1.7vw, 1rem);
            color: var(--text-light);
            line-height: 1.6;
            max-width: 360px;
        }
        .home-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .home-tag {
            background: var(--blue-light);
            color: var(--blue-dark);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 13px 34px;
            border-radius: 28px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            letter-spacing: 0.4px;
            transition: all var(--transition);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 6px 20px rgba(74, 144, 217, 0.32);
        }
        .btn-primary:hover {
            background: var(--blue-dark);
            box-shadow: 0 8px 26px rgba(74, 144, 217, 0.42);
            transform: translateY(-2px);
        }
        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(74, 144, 217, 0.28);
        }
        .btn-outline {
            background: #fff;
            color: var(--blue);
            border: 2px solid var(--blue);
        }
        .btn-outline:hover {
            background: var(--blue-light);
        }
        .btn-outline:active {
            transform: scale(0.95);
        }
        .btn-sm {
            padding: 9px 20px;
            font-size: 0.9rem;
            border-radius: 22px;
        }

        /* ========== 答题页 ========== */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .quiz-badge {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--blue-dark);
            background: var(--blue-light);
            padding: 5px 13px;
            border-radius: 14px;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .quiz-timer {
            font-weight: 700;
            font-size: 1rem;
            color: var(--blue);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.3s;
        }
        .quiz-timer.warning {
            color: #e67e22;
            animation: pulse 0.65s infinite;
        }
        .quiz-timer.danger {
            color: #e74c3c;
            animation: pulse 0.35s infinite;
        }
        .quiz-progress {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
            white-space: nowrap;
        }
        .quiz-question {
            font-size: clamp(1rem, 1.8vw, 1.15rem);
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
            margin-bottom: 12px;
            letter-spacing: 0.25px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 8px;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            border: 2px solid #e4eaf1;
            background: #fafbfd;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.95rem;
            color: var(--text);
            letter-spacing: 0.2px;
            -webkit-tap-highlight-color: transparent;
        }
        .quiz-option:hover:not(.disabled) {
            border-color: #c2d3e8;
            background: #f5f8fb;
            transform: translateX(3px);
        }
        .quiz-option:active:not(.disabled) {
            transform: scale(0.97);
        }
        .quiz-option .opt-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #eef3f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--blue);
            flex-shrink: 0;
            transition: all var(--transition);
        }
        .quiz-option.correct {
            border-color: var(--green) !important;
            background: var(--green-bg) !important;
            animation: popIn 0.4s ease-out;
        }
        .quiz-option.correct .opt-letter {
            background: #d5f5e3;
            color: var(--green);
        }
        .quiz-option.wrong {
            border-color: var(--red) !important;
            background: var(--red-bg) !important;
        }
        .quiz-option.wrong .opt-letter {
            background: #fadbd8;
            color: var(--red);
        }
        .quiz-option.disabled {
            pointer-events: none;
            opacity: 0.72;
        }
        .quiz-option.disabled.correct {
            opacity: 1;
        }
        .quiz-feedback {
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-top: 4px;
            font-size: 0.93rem;
            color: var(--text);
            line-height: 1.55;
            border-left: 4px solid #d5dfea;
            animation: fadeIn 0.32s ease-out;
            letter-spacing: 0.15px;
        }
        .quiz-feedback.fb-correct {
            border-left-color: var(--green);
            background: var(--green-bg);
        }
        .quiz-feedback.fb-wrong {
            border-left-color: var(--red);
            background: var(--red-bg);
        }
        .quiz-feedback .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--gold-bg);
            color: #8b6914;
            padding: 5px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.82rem;
            margin-top: 6px;
            animation: popIn 0.5s ease-out 0.15s both;
        }
        .quiz-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
            padding-top: 8px;
            flex-wrap: wrap;
        }
        .card-counter {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ========== 结算页 ========== */
        .result-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            gap: 14px;
            padding: 8px 0;
        }
        .result-score-circle {
            width: 110px;
            height: 110px;
            position: relative;
            margin: 4px auto;
        }
        .result-score-circle svg {
            width: 110px;
            height: 110px;
            transform: rotate(-90deg);
        }
        .result-score-circle .bg-ring {
            fill: none;
            stroke: #e8ecf1;
            stroke-width: 9;
        }
        .result-score-circle .fg-ring {
            fill: none;
            stroke: var(--blue);
            stroke-width: 9;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease-out;
        }
        .result-score-inner {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .result-score-num {
            font-size: 2.2rem;
            color: var(--blue);
            line-height: 1;
        }
        .result-score-total {
            font-size: 0.82rem;
            color: var(--text-light);
        }
        .result-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.3px;
        }
        .result-detail {
            font-size: 0.93rem;
            color: var(--text-light);
            line-height: 1.6;
            max-width: 380px;
        }
        .result-cards {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .result-card-item {
            width: 80px;
            padding: 10px 6px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 1.8em;
            transition: all var(--transition);
            background: #f4f5f7;
            border: 2px solid #e4e8ef;
            color: #bbb;
        }
        .result-card-item.collected {
            background: #fff;
            border-color: #d0e2f5;
            color: inherit;
            box-shadow: 0 3px 14px rgba(74, 144, 217, 0.12);
            animation: cardReveal 0.5s ease-out backwards;
        }
        .result-card-item .card-label {
            font-size: 0.35em;
            font-weight: 500;
            white-space: nowrap;
            color: #999;
            letter-spacing: 0.1px;
        }
        .result-card-item.collected .card-label {
            color: #5a6c7d;
        }
        .result-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 浮动粒子 */
        .float-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 26px;
            animation: floatUp 0.95s ease-out forwards;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .container {
                padding: 16px 12px;
                border-radius: 14px;
            }
            .quiz-option {
                padding: 11px 12px;
                gap: 7px;
                font-size: 0.88rem;
            }
            .quiz-option .opt-letter {
                width: 26px;
                height: 26px;
                font-size: 0.78rem;
            }
            .btn {
                padding: 11px 24px;
                font-size: 0.95rem;
            }
            .result-score-circle {
                width: 90px;
                height: 90px;
            }
            .result-score-circle svg {
                width: 90px;
                height: 90px;
            }
            .result-score-num {
                font-size: 1.8rem;
            }
            .result-card-item {
                width: 66px;
                padding: 8px 4px;
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- ==================== 首页 ==================== -->
        <div class="page active" id="homePage">
            <div class="home-content">
                <div class="home-icon">🔬</div>
                <h1 class="home-title">物理<span>奇物</span>档案馆</h1>
                <p class="home-desc">
                    探索生活中奇妙的热现象<br>答对题目，收集物理奇物卡片！
                </p>
                <div class="home-tags">
                    <span class="home-tag">💧 蒸发</span>
                    <span class="home-tag">🪟 凝结</span>
                    <span class="home-tag">🌡️ 温度</span>
                </div>
                <button class="btn btn-primary" onclick="startGame()">
                    🚀 开始探索
                </button>
                <p style="font-size:0.8rem;color:#aaa;margin-top:2px;">共3题 · 每题30秒 · 答对收集卡片</p>
            </div>
        </div>

        <!-- ==================== 答题页 ==================== -->
        <div class="page" id="quizPage">
            <div class="quiz-header">
                <span class="quiz-badge" id="quizBadge">热现象</span>
                <span class="quiz-progress" id="quizProgress">第 1/3 题</span>
                <span class="quiz-timer" id="quizTimer">⏱ 30</span>
            </div>
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="quiz-options" id="quizOptions"></div>
            <div id="quizFeedback"></div>
            <div class="quiz-bottom">
                <span class="card-counter" id="cardCounter">🎴 已收集：0/3</span>
                <button class="btn btn-primary btn-sm" id="btnNext" style="display:none;" onclick="nextQuestion()">
                    下一题 ➡️
                </button>
            </div>
        </div>

        <!-- ==================== 结算页 ==================== -->
        <div class="page" id="resultPage">
            <div class="result-content" id="resultContent">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 题库（3道题——热现象） ====================
            const questions = [{
                id: 1,
                category: '热现象',
                type: '判断',
                question: '炎热夏天，往地面洒水会感觉凉快？',
                options: ['对', '错'],
                answer: 0,
                explanation: '地面上的水变成水汽，带走热量。水蒸发的时候会从周围吸收热量，地面和空气的温度就降低了，所以感觉凉快。',
                cardName: '蒸发吸热卡',
                cardEmoji: '💧'
            }, {
                id: 2,
                category: '热现象',
                type: '判断',
                question: '冬天窗户内侧出现一层小水珠，是外面雨水溅上来的？',
                options: ['正确', '错误'],
                answer: 1,
                explanation: '屋内温热水汽碰到冷玻璃，凝结成小水珠。冬天屋内暖和、水汽多，玻璃被外面的冷空气吹得很冷，热的水汽一碰到冷玻璃就变成水珠了，和外面的雨水没关系。',
                cardName: '凝结现象卡',
                cardEmoji: '🪟'
            }, {
                id: 3,
                category: '热现象',
                type: '单选',
                question: '0℃的冰和0℃的水，冷热程度一样吗？',
                options: ['一样', '水更暖', '冰更冷'],
                answer: 0,
                explanation: '温度一样，冷热程度就一样。虽然冰是固体、水是液体，但它们的温度都是0℃，所以摸起来的冷热感觉是一样的。只是冰要变成水还需要吸收额外的热量。',
                cardName: '温度认知卡',
                cardEmoji: '🌡️'
            }];

            const TOTAL = questions.length;
            const TIME_LIMIT = 30;

            // ==================== 游戏状态 ====================
            let currentIndex = 0;
            let score = 0;
            let collected = [false, false, false];
            let timerInterval = null;
            let timeLeft = TIME_LIMIT;
            let answered = false;

            // ==================== DOM 引用 ====================
            const homePage = document.getElementById('homePage');
            const quizPage = document.getElementById('quizPage');
            const resultPage = document.getElementById('resultPage');
            const quizBadge = document.getElementById('quizBadge');
            const quizProgress = document.getElementById('quizProgress');
            const quizTimer = document.getElementById('quizTimer');
            const quizQuestion = document.getElementById('quizQuestion');
            const quizOptions = document.getElementById('quizOptions');
            const quizFeedback = document.getElementById('quizFeedback');
            const btnNext = document.getElementById('btnNext');
            const cardCounter = document.getElementById('cardCounter');
            const resultContent = document.getElementById('resultContent');
            const appContainer = document.getElementById('appContainer');

            // ==================== 页面切换 ====================
            function showPage(page) {
                [homePage, quizPage, resultPage].forEach(p => p.classList.remove('active'));
                page.classList.add('active');
                page.style.animation = 'none';
                page.offsetHeight;
                page.style.animation = '';
            }

            // ==================== 开始游戏 ====================
            window.startGame = function() {
                currentIndex = 0;
                score = 0;
                collected = [false, false, false];
                answered = false;
                updateCardCounter();
                showPage(quizPage);
                loadQuestion(0);
                appContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // ==================== 加载题目 ====================
            function loadQuestion(index) {
                if (index >= TOTAL) {
                    endGame();
                    return;
                }
                currentIndex = index;
                answered = false;
                timeLeft = TIME_LIMIT;
                clearInterval(timerInterval);

                const q = questions[index];
                quizBadge.textContent = q.category;
                quizProgress.textContent = `第 ${index + 1}/${TOTAL} 题`;
                quizQuestion.textContent = q.question;
                quizFeedback.innerHTML = '';
                btnNext.style.display = 'none';
                updateTimerDisplay();
                quizTimer.classList.remove('warning', 'danger');

                // 渲染选项
                const letters = ['A', 'B', 'C', 'D'];
                let html = '';
                q.options.forEach((opt, i) => {
                    html += `
                    <div class="quiz-option" data-idx="${i}" onclick="selectAnswer(${i})">
                      <span class="opt-letter">${letters[i]}</span>
                      <span>${opt}</span>
                    </div>`;
                });
                quizOptions.innerHTML = html;

                // 启动倒计时
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 10 && timeLeft > 5) {
                        quizTimer.classList.add('warning');
                        quizTimer.classList.remove('danger');
                    } else if (timeLeft <= 5) {
                        quizTimer.classList.remove('warning');
                        quizTimer.classList.add('danger');
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        if (!answered) handleTimeout();
                    }
                }, 1000);
            }

            function updateTimerDisplay() {
                quizTimer.innerHTML = `⏱ ${timeLeft}`;
            }

            // ==================== 选择答案 ====================
            window.selectAnswer = function(idx) {
                if (answered) return;
                answered = true;
                clearInterval(timerInterval);
                quizTimer.classList.remove('warning', 'danger');

                const q = questions[currentIndex];
                const isCorrect = (idx === q.answer);
                const opts = quizOptions.querySelectorAll('.quiz-option');

                opts.forEach(o => o.classList.add('disabled'));

                if (isCorrect) {
                    opts[idx].classList.add('correct');
                    score++;
                    collected[currentIndex] = true;
                    updateCardCounter();
                    spawnParticles(opts[idx]);
                } else {
                    opts[idx].classList.add('wrong');
                    opts[q.answer].classList.add('correct');
                }

                showFeedback(isCorrect, q);

                btnNext.style.display = 'inline-flex';
                if (currentIndex >= TOTAL - 1) {
                    btnNext.textContent = '查看结果 🏆';
                } else {
                    btnNext.textContent = '下一题 ➡️';
                }
            };

            function handleTimeout() {
                if (answered) return;
                answered = true;
                const q = questions[currentIndex];
                const opts = quizOptions.querySelectorAll('.quiz-option');
                opts.forEach(o => o.classList.add('disabled'));
                opts[q.answer].classList.add('correct');
                showFeedback(false, q);
                btnNext.style.display = 'inline-flex';
                if (currentIndex >= TOTAL - 1) {
                    btnNext.textContent = '查看结果 🏆';
                } else {
                    btnNext.textContent = '下一题 ➡️';
                }
            }

            function showFeedback(isCorrect, q) {
                const fbClass = isCorrect ? 'fb-correct' : 'fb-wrong';
                const icon = isCorrect ? '✅' : '❌';
                const title = isCorrect ? '回答正确！' : '回答错误';
                const cardHTML = isCorrect ?
                    `<div class="card-badge">🎴 获得卡片：${q.cardEmoji} ${q.cardName}</div>` :
                    '';
                quizFeedback.innerHTML = `
                <div class="quiz-feedback ${fbClass}">
                  <strong>${icon} ${title}</strong>
                  <p style="margin-top:5px;">💡 ${q.explanation}</p>
                  ${cardHTML}
                </div>`;
            }

            function updateCardCounter() {
                const count = collected.filter(Boolean).length;
                cardCounter.textContent = `🎴 已收集：${count}/${TOTAL}`;
            }

            // ==================== 下一题 ====================
            window.nextQuestion = function() {
                if (currentIndex >= TOTAL - 1) {
                    endGame();
                } else {
                    loadQuestion(currentIndex + 1);
                    appContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            // ==================== 结束游戏 ====================
            function endGame() {
                clearInterval(timerInterval);
                showPage(resultPage);
                renderResult();
                appContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function renderResult() {
                const totalCollected = collected.filter(Boolean).length;

                let title, detail;
                if (totalCollected === 3) {
                    title = '🏅 物理小侦探';
                    detail = '太厉害了！三道题全部答对！蒸发、凝结、温度——这些热现象的原理你都掌握了，你已经是合格的物理小侦探啦！';
                } else if (totalCollected === 2) {
                    title = '🔍 敏锐观察家';
                    detail = '答对了两题，很不错哦！你已经发现了不少生活中的热现象奥秘。再观察观察身边的现象，下次一定能全部答对！';
                } else if (totalCollected === 1) {
                    title = '🌱 萌芽探索者';
                    detail = '物理世界的大门刚刚打开，答对一题也是胜利！保持好奇心，多留意身边冷热变化的现象，你会越来越厉害的。';
                } else {
                    title = '💪 勇敢起步者';
                    detail = '虽然这次没有收集到卡片，但每一次尝试都在积累经验。别灰心，再来一次，你一定可以的！';
                }

                const radius = 42;
                const circumference = 2 * Math.PI * radius;
                const dashOffset = circumference - (circumference * totalCollected / TOTAL);

                let cardsHTML = '';
                questions.forEach((q, i) => {
                    const cls = collected[i] ? 'collected' : '';
                    const emoji = collected[i] ? q.cardEmoji : '❓';
                    const label = collected[i] ? q.cardName : '未解锁';
                    const delay = collected[i] ? `animation-delay:${i * 0.12}s;` : '';
                    cardsHTML += `
                    <div class="result-card-item ${cls}" style="${delay}">
                      <span>${emoji}</span>
                      <span class="card-label">${label}</span>
                    </div>`;
                });

                resultContent.innerHTML = `
                <div class="result-score-circle">
                  <svg viewBox="0 0 100 100">
                    <circle class="bg-ring" cx="50" cy="50" r="${radius}"/>
                    <circle class="fg-ring" cx="50" cy="50" r="${radius}"
                      stroke-dasharray="${circumference}"
                      stroke-dashoffset="${circumference}"
                      id="resultRing"
                      style="stroke:${totalCollected===3?'#27ae60':totalCollected===2?'#f0a500':'#4A90D9'}"/>
                  </svg>
                  <div class="result-score-inner">
                    <span class="result-score-num">${totalCollected}</span>
                    <span class="result-score-total">/ ${TOTAL}</span>
                  </div>
                </div>
                <div class="result-title">${title}</div>
                <p class="result-detail">${detail}</p>
                <div class="result-cards">${cardsHTML}</div>
                <div class="result-actions">
                  <button class="btn btn-primary" onclick="startGame()">🔄 再来一次</button>
                  <button class="btn btn-outline btn-sm" onclick="goHome()">🏠 返回首页</button>
                </div>`;

                setTimeout(() => {
                    const ring = document.getElementById('resultRing');
                    if (ring) ring.style.strokeDashoffset = dashOffset;
                }, 180);
            }

            window.goHome = function() {
                clearInterval(timerInterval);
                showPage(homePage);
                appContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // ==================== 粒子特效 ====================
            function spawnParticles(el) {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const symbols = ['✨', '🌟', '💫', '🎉', '⭐'];
                for (let i = 0; i < 6; i++) {
                    const p = document.createElement('span');
                    p.className = 'float-particle';
                    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    p.style.left = cx + (Math.random() - 0.5) * 100 + 'px';
                    p.style.top = cy + (Math.random() - 0.5) * 40 + 'px';
                    p.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
                    p.style.fontSize = (20 + Math.random() * 18) + 'px';
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 1100);
                }
            }

            // ==================== 初始化 ====================
            updateCardCounter();
            console.log('🏛️ 物理奇物档案馆已就绪！共 ' + TOTAL + ' 道题（热现象专题）');
            console.log('💡 点击"开始探索"按钮即可开始答题');
        })();
    </script>

    <!--
    ==================== 📝 使用说明 ====================
    本文件是完整独立的HTML5游戏，保存后双击即可在浏览器中运行。

    📝 【当前3道题目（热现象专题）】
    第1题：炎热夏天，往地面洒水会感觉凉快？ → 答案：对（蒸发吸热）
    第2题：冬天窗户内侧出现小水珠，是外面雨水溅上来？ → 答案：错误（凝结现象）
    第3题：0℃的冰和0℃的水，冷热程度一样吗？ → 答案：一样（温度相同）

    📝 【如何修改/增加题目】
    在 <script> 标签内找到 questions 数组，每道题格式如下：

    {
      id: 编号,
      category: '热现象',       // '光现象'、'力学'、'热现象'

      question: '题目文字',
      options: ['选项A','选项B','选项C'],
      answer: 0,                // 正确答案索引（0=第一个选项）
      explanation: '大白话科普解释',
      cardName: '卡片名称',
      cardEmoji: '💧'           // emoji图标
    }

    --blue: #4A90D9;     主色调
