<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>你的广东歌人格</title>
    <!-- html2canvas for poster -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        :root {
            --bg-deep: #0B1020;
            --bg-purple: #1A0F2E;
            --gold: #D4A76A;
            --gold-glow: rgba(212, 167, 106, 0.3);
            --text-light: #F0E8E0;
            --text-muted: #A09890;
            --card-bg: rgba(26, 15, 46, 0.75);
            --border-glow: rgba(212, 167, 106, 0.15);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse at 30% 10%, rgba(26, 15, 46, 0.6) 0%, transparent 70%),
                radial-gradient(ellipse at 70% 90%, rgba(11, 16, 32, 0.8) 0%, transparent 60%);
        }

        /* ===== PAGES ===== */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.5s ease;
            transform: scale(0.98);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .page.exit {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        /* ===== P0: 启动页 ===== */
        #page-start {
            background:
                radial-gradient(ellipse at 50% 30%, rgba(26, 15, 46, 0.9) 0%, var(--bg-deep) 80%),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iODAwIj48ZGVmcz48cmFkaWFsR3JhZGllbnQgaWQ9ImciIGN4PSI1MCUiIGN5PSI0MCUiIHI9IjcwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3R5bGU9InN0b3AtY29sb3I6cmdiYSgyNiwxNSw0NiwwLjUpIi8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdHlsZT0ic3RvcC1jb2xvcjpyZ2JhKDExLDE2LDMyLDApIi8+PC9yYWRpYWxHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4MDAiIGZpbGw9InVybCgjZykiLz48L3N2Zz4=');
            background-size: cover;
            background-position: center;
            justify-content: center;
            text-align: center;
        }
        #page-start .start-bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 167, 106, 0.08) 0%, transparent 70%);
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translateX(-50%) scale(1.2);
                opacity: 1;
            }
        }
        .start-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(212, 167, 106, 0.15), 0 0 80px rgba(212, 167, 106, 0.05);
            position: relative;
            z-index: 2;
            margin-bottom: 12px;
        }
        .start-sub {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 8px;
            font-weight: 300;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }
        .start-quote {
            font-size: 15px;
            color: rgba(240, 232, 224, 0.7);
            line-height: 2;
            letter-spacing: 2px;
            max-width: 300px;
            margin: 0 auto 36px;
            position: relative;
            z-index: 2;
            font-weight: 300;
        }
        .start-quote span {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 4px;
        }
        .btn-start {
            background: transparent;
            border: 1.5px solid var(--gold);
            color: var(--gold);
            padding: 14px 48px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 6px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            z-index: 2;
            background: rgba(212, 167, 106, 0.04);
            backdrop-filter: blur(4px);
            font-family: inherit;
        }
        .btn-start:hover {
            background: rgba(212, 167, 106, 0.12);
            box-shadow: 0 0 40px rgba(212, 167, 106, 0.08);
            transform: scale(1.02);
        }
        .btn-start:active {
            transform: scale(0.96);
        }

        /* raindrops */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }
        .rain-drop {
            position: absolute;
            width: 1px;
            background: rgba(212, 167, 106, 0.15);
            animation: rainFall linear infinite;
        }
        @keyframes rainFall {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 20px));
                opacity: 0;
            }
        }

        /* ===== P1: 答题页 ===== */
        #page-quiz {
            padding: 16px 16px 20px;
            justify-content: flex-start;
            padding-top: 20px;
            background: var(--bg-deep);
        }
        .quiz-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 16px;
            flex-shrink: 0;
        }
        .quiz-progress-text {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 300;
        }
        .quiz-progress-text strong {
            color: var(--gold);
            font-weight: 600;
        }
        .quiz-progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            margin-bottom: 20px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .quiz-progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), #E8C88A);
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        .quiz-question {
            font-family: 'Noto Serif SC', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 1px;
            line-height: 1.6;
            width: 100%;
            text-align: center;
            padding: 12px 0 20px;
            flex-shrink: 0;
            min-height: 60px;
        }
        .quiz-options {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 8px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .quiz-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 14px;
            color: rgba(240, 232, 224, 0.85);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.4;
            min-height: 52px;
            position: relative;
            backdrop-filter: blur(2px);
        }
        .quiz-option .opt-label {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
            transition: all 0.3s ease;
        }
        .quiz-option:hover {
            background: rgba(212, 167, 106, 0.05);
            border-color: rgba(212, 167, 106, 0.15);
            transform: translateX(2px);
        }
        .quiz-option:active {
            transform: scale(0.97);
        }
        .quiz-option.selected {
            background: rgba(212, 167, 106, 0.08);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 167, 106, 0.04);
        }
        .quiz-option.selected .opt-label {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 167, 106, 0.1);
        }

        /* ===== P2: 加载页 ===== */
        #page-loading {
            background: var(--bg-deep);
            text-align: center;
            justify-content: center;
            gap: 24px;
        }
        .loading-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(212, 167, 106, 0.08);
            border-top-color: var(--gold);
            animation: spin 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            position: relative;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .loading-ring::after {
            content: '♫';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            color: var(--gold);
            opacity: 0.6;
            animation: pulseNote 1.5s ease-in-out infinite;
        }
        @keyframes pulseNote {
            0%,
            100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(0.9);
            }
            50% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }
        .loading-text {
            font-size: 16px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
        }
        .loading-text em {
            color: var(--gold);
            font-style: normal;
            font-weight: 400;
        }
        .loading-names {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 8px;
            font-weight: 300;
            height: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            text-align: center;
        }
        .loading-names .name-flash {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: nowrap;
            font-size: 13px;
            color: rgba(212, 167, 106, 0.2);
            letter-spacing: 4px;
        }
        .loading-names .name-flash.show {
            opacity: 1;
        }

        /* ===== P3: 结果页 ===== */
        #page-result {
            padding: 20px 16px 16px;
            justify-content: flex-start;
            overflow-y: auto;
            background: var(--bg-deep);
        }
        .result-scroll {
            width: 100%;
            max-width: 440px;
            padding-bottom: 30px;
        }
        .result-badge {
            text-align: center;
            padding: 12px 0 4px;
        }
        .result-badge .label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 6px;
            font-weight: 300;
            text-transform: uppercase;
        }
        .result-badge .name {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 50px rgba(212, 167, 106, 0.08);
            letter-spacing: 4px;
            margin: 2px 0 0;
        }
        .result-badge .sub-name {
            font-size: 16px;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 300;
            margin-top: -2px;
        }
        .result-badge .match {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .result-badge .match strong {
            color: var(--gold);
            font-weight: 600;
            font-size: 18px;
        }

        .result-divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 16px auto;
            opacity: 0.3;
        }

        /* DNA条形图 */
        .dna-section {
            width: 100%;
            padding: 4px 0 12px;
        }
        .dna-section .dna-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 12px;
            text-align: center;
        }
        .dna-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .dna-item .dna-label {
            font-size: 12px;
            color: var(--text-muted);
            width: 48px;
            flex-shrink: 0;
            text-align: right;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .dna-item .dna-track {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .dna-item .dna-track .dna-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(212, 167, 106, 0.3), var(--gold));
            transition: width 1.2s ease;
            width: 0%;
        }
        .dna-item .dna-pct {
            font-size: 11px;
            color: var(--text-muted);
            width: 34px;
            flex-shrink: 0;
            font-weight: 300;
            text-align: right;
        }

        /* 灵魂歌单 */
        .playlist-section {
            width: 100%;
            padding: 8px 0 12px;
        }
        .playlist-section .pl-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 10px;
            text-align: center;
        }
        .playlist-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .playlist-tags .tag {
            background: rgba(212, 167, 106, 0.06);
            border: 1px solid rgba(212, 167, 106, 0.08);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: rgba(240, 232, 224, 0.7);
            letter-spacing: 1px;
            font-weight: 300;
            transition: all 0.3s ease;
        }
        .playlist-tags .tag:hover {
            background: rgba(212, 167, 106, 0.1);
            border-color: rgba(212, 167, 106, 0.2);
        }

        /* 人格解析 */
        .analysis-section {
            width: 100%;
            padding: 8px 0 12px;
        }
        .analysis-section .an-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 10px;
            text-align: center;
        }
        .analysis-section .an-text {
            font-size: 14px;
            color: rgba(240, 232, 224, 0.8);
            line-height: 2;
            text-align: center;
            letter-spacing: 0.5px;
            font-weight: 300;
            padding: 0 4px;
        }
        .analysis-section .an-text em {
            color: var(--gold);
            font-style: normal;
            font-weight: 400;
        }

        /* 关键词 */
        .keywords-section {
            width: 100%;
            padding: 8px 0 12px;
        }
        .keywords-section .kw-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 10px;
            text-align: center;
        }
        .keywords-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .keywords-tags .kw {
            background: rgba(212, 167, 106, 0.04);
            border: 1px solid rgba(212, 167, 106, 0.06);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: rgba(240, 232, 224, 0.5);
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* 代表歌词 */
        .lyric-section {
            width: 100%;
            padding: 8px 0 16px;
        }
        .lyric-section .ly-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 10px;
            text-align: center;
        }
        .lyric-section .ly-text {
            font-size: 14px;
            color: rgba(240, 232, 224, 0.6);
            line-height: 2;
            text-align: center;
            letter-spacing: 1px;
            font-weight: 300;
            padding: 12px 16px;
            border-left: 1px solid rgba(212, 167, 106, 0.08);
            border-right: 1px solid rgba(212, 167, 106, 0.08);
            border-radius: 4px;
            font-style: italic;
        }
        .lyric-section .ly-text .source {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-style: normal;
            margin-top: 6px;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        /* 优点/风险 */
        .traits-section {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 8px 0 12px;
        }
        .traits-section .trait-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
        }
        .traits-section .trait-box .trait-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 3px;
            font-weight: 300;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .traits-section .trait-box .trait-items {
            font-size: 12px;
            color: rgba(240, 232, 224, 0.6);
            line-height: 1.8;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .traits-section .trait-box.good {
            border-color: rgba(212, 167, 106, 0.06);
        }
        .traits-section .trait-box.risk {
            border-color: rgba(255, 100, 100, 0.06);
        }
        .traits-section .trait-box.risk .trait-label {
            color: rgba(255, 150, 150, 0.4);
        }
        .traits-section .trait-box.risk .trait-items {
            color: rgba(255, 150, 150, 0.3);
        }

        /* 推荐人格 */
        .recommend-section {
            width: 100%;
            padding: 8px 0 12px;
            text-align: center;
        }
        .recommend-section .rec-title {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 10px;
        }
        .recommend-section .rec-items {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .recommend-section .rec-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 8px 18px;
            font-size: 12px;
            color: rgba(240, 232, 224, 0.5);
            letter-spacing: 1px;
            font-weight: 300;
        }
        .recommend-section .rec-item .rec-name {
            color: var(--gold);
            font-weight: 400;
        }

        /* 按钮 - 分享 */
        .result-actions {
            width: 100%;
            display: flex;
            gap: 12px;
            padding: 16px 0 8px;
            justify-content: center;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 12px 28px;
            font-size: 13px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 2px;
            font-weight: 300;
            flex: 1;
            max-width: 180px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: rgba(212, 167, 106, 0.08);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 28px;
            font-size: 13px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 2px;
            font-weight: 400;
            flex: 1;
            max-width: 180px;
        }
        .btn-primary:hover {
            background: rgba(212, 167, 106, 0.15);
            box-shadow: 0 0 40px rgba(212, 167, 106, 0.04);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }

        /* ===== P4: 海报页 ===== */
        #page-poster {
            padding: 0;
            background: var(--bg-deep);
            justify-content: center;
            overflow: hidden;
        }
        .poster-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 9 / 16;
            border-radius: 16px;
            overflow: hidden;
            background: var(--bg-deep);
            background-image:

        // 生成随机粒子 (歌词碎片)
        function spawnParticles(x, y, count = 10) {
            const container = particleContainer;
            const fragments = ['♫', '♪', '♥', '✦', '·', '〜', '✧', '♬'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('span');
                el.className = 'particle';
                el.textContent = fragments[Math.floor(Math.random() * fragments.length)];
                const angle = Math.random() * 2 * Math.PI;
                const dist = 60 + Math.random() * 120;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist - 40;
                el.style.left = (x + (Math.random() - 0.5) * 20) + 'px';
                el.style.top = (y + (Math.random() - 0.5) * 20) + 'px';
                el.style.setProperty('--tx', tx + 'px');
                el.style.setProperty('--ty', ty + 'px');
                el.style.fontSize = (10 + Math.random() * 12) + 'px';
                el.style.color = `rgba(212,167,106,${0.2 + Math.random() * 0.4})`;
                container.appendChild(el);
                setTimeout(() => el.remove(), 900);
            }
        }

        function initRain(containerId) {
            const container = $(containerId);
            if (!container) return;
            const count = 40;
            for (let i = 0; i < count; i++) {
                const drop = document.createElement('div');
                drop.className = 'rain-drop';
                const left = Math.random() * 100;
                const delay = Math.random() * 3;
                const duration = 1.5 + Math.random() * 2;
                const height = 30 + Math.random() * 60;
                drop.style.left = left + '%';
                drop.style.animationDuration = duration + 's';
                drop.style.animationDelay = delay + 's';
                drop.style.height = height + 'px';
                drop.style.opacity = 0.1 + Math.random() * 0.2;
                container.appendChild(drop);
            }
        }

        function selectOption(qIndex, optIndex) {
            if (answered[qIndex] !== undefined) return;
            const q = QUESTIONS[qIndex];
            const opt = q.options[optIndex];
            const persona = opt.primary;
            if (!persona) return;
            scores[persona] = (scores[persona] || 0) + 3;
            // secondary 加1分 (如果有)
            // 在本题数据中 secondary 未使用，但保留扩展
            answered[qIndex] = optIndex;

            // 更新UI
            const items = qOptions.querySelectorAll('.quiz-option');
            items.forEach((el, i) => {
                if (i === optIndex) el.classList.add('selected');
                else el.classList.remove('selected');
            });

            // 下一题
            setTimeout(() => {
                if (qIndex + 1 < QUESTIONS.length) {
                    currentQuestion = qIndex + 1;
                    renderQuestion(currentQuestion);
                } else {
                    isQuizEnd = true;
                    finishQuiz();
                }
            }, 280);
        }

        function finishQuiz() {
            // 显示加载页
            showPage('loading');
            startLoadingAnimation();
        }

        // ============================================================
        // LOADING ANIMATION
        // ============================================================
        let loadingInterval = null;
        let loadingFlashInterval = null;

        function startLoadingAnimation() {
            const container = $('loadingNames');
            const allNames = ALL_PERSONAS;
            let currentIndex = 0;
            let flashCount = 0;
            const maxFlashes = 18;

            // 清空
            container.innerHTML = '';
            const span = document.createElement('span');
            span.className = 'name-flash show';
            span.textContent = allNames[0];
            container.appendChild(span);

            if (loadingFlashInterval) clearInterval(loadingFlashInterval);
            if (loadingInterval) clearInterval(loadingInterval);

            loadingFlashInterval = setInterval(() => {
                const items = container.querySelectorAll('.name-flash');
                items.forEach(el => el.classList.remove('show'));
                const newSpan = document.createElement('span');
                newSpan.className = 'name-flash show';
                currentIndex = (currentIndex + 1) % allNames.length;
                newSpan.textContent = allNames[currentIndex];
                container.appendChild(newSpan);
                // 移除过多的span
                while (container.children.length > 6) {
                    container.removeChild(container.firstChild);
                }
                flashCount++;
                if (flashCount >= maxFlashes) {
                    clearInterval(loadingFlashInterval);
                    loadingFlashInterval = null;
                    // 收束动画
                    setTimeout(() => {
                        // 显示结果
                        showResult();
                    }, 600);
                }
            }, 180);

            // 额外音乐律动感 - 随机改变环的颜色
            let hueShift = 0;
            loadingInterval = setInterval(() => {
                const ring = document.querySelector('.loading-ring');
                if (ring) {
                    hueShift = (hueShift + 2) % 30;
                    const gold = `hsl(42, 60%, ${55 + Math.sin(hueShift * 0.1) * 8}%)`;
                    ring.style.borderTopColor = gold;
                }
            }, 300);
        }

        // ============================================================
        // RESULT
        // ============================================================
        function showResult() {
            if (loadingFlashInterval) {
                clearInterval(loadingFlashInterval);
                loadingFlashInterval = null;
            }
            if (loadingInterval) {
                clearInterval(loadingInterval);
                loadingInterval = null;
            }

            const result = computeResult();
            resultData = result;
            isHidden = result.isHidden;

            // 渲染结果
            renderResult(result);
            showPage('result');

            // 触发DNA动画
            setTimeout(() => {
                document.querySelectorAll('.dna-fill').forEach(el => {
                    const w = el.dataset.width || '0%';
                    el.style.width = w;
                });
            }, 400);
        }

        function renderResult(result) {
            const container = resultContent;
            const isH = result.isHidden;
            const main = result.main;
            const mainData = result.mainData;
            const sub = result.sub;
            const subData = result.subData;
            const hidden = result.hidden;

            if (!mainData) {
                container.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text-muted);">无法解析人格，请重试</div>';
                return;
            }

            let html = '';

            // 隐藏人格标签
            if (isH && hidden) {
                html += `<div class="hidden-badge-glow" style="text-align:center;display:block;width:fit-content;margin:0 auto 8px;">✦ 隐藏双人格 · 稀有度 ${hidden.rarity} ✦</div>`;
            }

            // 标题区
            html += `<div class="result-badge ${isH ? 'hidden-result' : ''}">`;
            html += `<div class="label">你的粤语歌词人格</div>`;
            if (isH && hidden) {
                html += `<div class="name">${hidden.title}</div>`;
                html += `<div class="sub-name">${hidden.name}</div>`;
            } else {
                html += `<div class="name">${mainData.title}</div>`;
                html += `<div class="sub-name">${main}</div>`;
            }
            const matchPct = isH && hidden ? 98 : (mainData.match || 94);
            html += `<div class="match">匹配度 <strong>${matchPct}%</strong></div>`;
            if (isH && hidden) {
                html += `<div style="font-size:11px;color:var(--text-muted);letter-spacing:2px;margin-top:2px;font-weight:300;">
                            核心 · ${hidden.core.join(' · ')}
                        </div>`;
            }
            html += `</div>`;

            html += `<div class="result-divider"></div>`;

            // DNA条形图
            const dna = isH && hidden ? {
                执念: 92,
                孤独: 88,
                浪漫: 76,
                共情: 70
            } : (mainData.dna || { 执念: 80, 孤独: 70, 浪漫: 60, 理性: 40 });

            html += `<div class="dna-section">`;
            html += `<div class="dna-title">— 灵魂 DNA —</div>`;
            const dnaItems = Object.entries(dna);
            dnaItems.forEach(([label, val]) => {
                const pct = Math.min(val, 100);
                html += `<div class="dna-item">
                            <span class="dna-label">${label}</span>
                            <div class="dna-track"><div class="dna-fill" data-width="${pct}%" style="width:0%;"></div></div>
                            <span class="dna-pct">${pct}%</span>
                        </div>`;
            });
            html += `</div>`;

            // 灵魂歌单
            const songs = isH && hidden ? (hidden.songs || ['一丝不挂', '某种老朋友', '无人之境']) : (mainData.songs || []);
            html += `<div class="playlist-section">`;
            html += `<div class="pl-title">— 灵魂歌单 —</div>`;
            html += `<div class="playlist-tags">`;
            songs.forEach(s => {
                html += `<span class="tag">${s}</span>`;
            });
            html += `</div></div>`;

            // 人格解析
            const analysis = isH && hidden ? hidden.analysis : (mainData.analysis || '');
            html += `<div class="analysis-section">`;
            html += `<div class="an-title">— 人格解析 —</div>`;
            html += `<div class="an-text">${analysis}</div>`;
            html += `</div>`;

            // 关键词
            const keywords = isH && hidden ? hidden.keywords : (mainData.keywords || []);
            html += `<div class="keywords-section">`;
            html += `<div class="kw-title">— 关键词 —</div>`;
            html += `<div class="keywords-tags">`;
            keywords.forEach(kw => {
                html += `<span class="kw">${kw}</span>`;
            });
            html += `</div></div>`;

            // 代表歌词
            const lyric = isH && hidden ? hidden.lyric : (mainData.lyric || '');
            const lyricSrc = isH && hidden ? hidden.lyricSource : (mainData.lyricSource || '');
            html += `<div class="lyric-section">`;
            html += `<div class="ly-title">— 代表歌词 —</div>`;
            html += `<div class="ly-text">${lyric}<span class="source">${lyricSrc}</span></div>`;
            html += `</div>`;

            // 优点 / 风险
            const good = isH && hidden ? ['深度共情', '艺术感知', '灵魂洞察'] : (mainData.good || ['深情', '共情力强']);
            const risk = isH && hidden ? ['内耗严重', '难以抽离', '孤独感'] : (mainData.risk || ['容易内耗', '过度投入']);
            html += `<div class="traits-section">`;
            html += `<div class="trait-box good"><div class="trait-label">✦ 优点</div><div class="trait-items">${good.join(' · ')}</div></div>`;
            html += `<div class="trait-box risk"><div class="trait-label">⚠ 风险</div><div class="trait-items">${risk.join(' · ')}</div></div>`;
            html += `</div>`;

            // 推荐人格
            const recs = isH && hidden ? ['张敬轩', 'Serrini'] : (mainData.recommend || ['张敬轩', '林家谦']);
            html += `<div class="recommend-section">`;
            html += `<div class="rec-title">— 推荐人格 —</div>`;
            html += `<div class="rec-items">`;
            recs.forEach(r => {
                const rData = getPersonaData(r);
                html += `<span class="rec-item"><span class="rec-name">${r}</span> ${rData ? '· ' + rData.title : ''}</span>`;
            });
            html += `</div></div>`;

            // 隐藏人格标识
            if (isH && hidden) {
                html +=
                    `<div style="text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:3px;padding:8px 0 4px;font-weight:300;opacity:0.3;">稀有度 ${hidden.rarity} · 双灵魂共鸣</div>`;
            }

            // 按钮区
            html += `<div class="result-actions">`;
            html += `<button class="btn-secondary" id="btnRetake">重新测试</button>`;
            html += `<button class="btn-primary" id="btnSharePoster">生成海报</button>`;
            html += `</div>`;

            container.innerHTML = html;

            // 绑定事件
            const retakeBtn = document.getElementById('btnRetake');
            if (retakeBtn) retakeBtn.addEventListener('click', resetQuiz);
            const shareBtn = document.getElementById('btnSharePoster');
            if (shareBtn) shareBtn.addEventListener('click', () => {
                showPoster();
            });
        }

        // ============================================================
        // POSTER
        // ============================================================
        function showPoster() {
            if (!resultData) return;
            const container = posterContent;
            const result = resultData;
            const isH = result.isHidden;
            const main = result.main;
            const mainData = result.mainData;
            const hidden = result.hidden;

            let html = '';
            html += `<div class="p-label">你的粤语歌词人格</div>`;
            if (isH && hidden) {
                html += `<div class="p-name-big" style="font-size:28px;">${hidden.title}</div>`;
                html += `<div class="p-sub" style="font-size:12px;letter-spacing:2px;">${hidden.name}</div>`;
            } else {
                html += `<div class="p-name-big">${mainData ? mainData.title : main}</div>`;
                html += `<div class="p-sub">${main}</div>`;
            }
            const matchPct = isH && hidden ? 98 : (mainData ? mainData.match : 94);
            html += `<div class="p-match">匹配度 <strong>${matchPct}%</strong></div>`;
            html += `<div class="p-divider"></div>`;
            html += `<div class="p-tagline">— 你的港乐灵魂 —</div>`;

            // 歌词
            const lyric = isH && hidden ? hidden.lyric : (mainData ? mainData.lyric : '');
            if (lyric) {
                html += `<div class="p-lyric">${lyric.length > 60 ? lyric.substring(0, 60) + '…' : lyric}</div>`;
            }

            // 关键词
            const keywords = isH && hidden ? hidden.core : (mainData ? mainData.keywords : []);
            if (keywords && keywords.length) {
                html +=
                    `<div style="font-size:9px;color:rgba(255,255,255,0.08);letter-spacing:3px;margin-top:6px;font-weight:300;">${keywords.join(' · ')}</div>`;
            }

            html += `<div class="p-footer">广东歌人格 · 港乐灵魂检测</div>`;

            container.innerHTML = html;

            // 重新生成雨滴
            const rainContainer = document.getElementById('posterRain');
            if (rainContainer) {
                rainContainer.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.animationDuration = (1.8 + Math.random() * 2) + 's';
                    drop.style.animationDelay = (Math.random() * 2) + 's';
                    drop.style.height = (20 + Math.random() * 40) + 'px';
                    drop.style.opacity = 0.05 + Math.random() * 0.1;
                    rainContainer.appendChild(drop);
                }
            }

            showPage('poster');
        }

        // ============================================================
        // RESET
        // ============================================================
        function resetQuiz() {
            currentQuestion = 0;
            scores = {};
            answered = [];
            isQuizEnd = false;
            resultData = null;
            isHidden = false;
            if (loadingFlashInterval) {
                clearInterval(loadingFlashInterval);
                loadingFlashInterval = null;
            }
            if (loadingInterval) {
                clearInterval(loadingInterval);
                loadingInterval = null;
            }
            showPage('start');
            // 重置进度
            progressFill.style.width = '0%';
            qProgressPct.textContent = '0%';
            // 重置loading名字
            const container = document.getElementById('loadingNames');
            if (container) {
                container.innerHTML = '<span class="name-flash show">陈奕迅</span>';
            }
        }

        // ============================================================
        // POSTER SAVE (using html2canvas)
        // ============================================================
        async function savePoster() {
            const container = document.getElementById('posterContainer');
            if (!container) return;
            try {
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#0B1020',
                    allowTaint: true,
                    logging: false,
                    width: container.scrollWidth,
                    height: container.scrollHeight
                });
                const link = document.createElement('a');
                link.download = '我的广东歌人格海报.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (e) {
                console.warn('海报生成失败', e);
                alert('生成海报失败，请尝试截图保存');
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            // 雨滴
            initRain('rainContainer');

            // 启动按钮
            document.getElementById('btnStart').addEventListener('click', () => {
                // 重置状态
                currentQuestion = 0;
                scores = {};
                answered = [];
                isQuizEnd = false;
                showPage('quiz');
                renderQuestion(0);
            });

            // 海报按钮
            document.getElementById('btnPosterBack').addEventListener('click', () => {
                showPage('result');
                // 重新渲染结果（保持数据）
                if (resultData) {
                    renderResult(resultData);
                }
            });

            document.getElementById('btnPosterSave').addEventListener('click', savePoster);

            // 默认显示启动页
            showPage('start');

            // 预加载部分数据
            console.log('广东歌人格测试 v1.0 已加载');
        }

        // 页面加载完成后启动
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
